<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <!-- 水平向右箭头 -->
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5a6a7a"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">核心业务流程</text>

  <!-- ===== 第 1 行：主流程 ===== -->

  <!-- ① 上传图片 -->
  <rect x="30" y="58" width="130" height="46" rx="23" fill="#5b7ee5" filter="url(#shadow)"/>
  <text x="95" y="86" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">用户上传图片</text>

  <line x1="160" y1="81" x2="210" y2="81" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ② AI 检测 -->
  <rect x="220" y="58" width="130" height="46" rx="10" fill="#3a9ad9" filter="url(#shadow)"/>
  <text x="285" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">AI 检测识别</text>
  <text x="285" y="93" text-anchor="middle" fill="#d0e8ff" font-size="9">YOLOv8 推理</text>

  <line x1="350" y1="81" x2="400" y2="81" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ③ 规则映射 -->
  <rect x="410" y="58" width="130" height="46" rx="10" fill="#3a9ad9" filter="url(#shadow)"/>
  <text x="475" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">规则映射</text>
  <text x="475" y="93" text-anchor="middle" fill="#d0e8ff" font-size="9">类别判定</text>

  <line x1="540" y1="81" x2="590" y2="81" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ④ 用户选择 -->
  <rect x="600" y="58" width="130" height="46" rx="10" fill="#5b7ee5" filter="url(#shadow)"/>
  <text x="665" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">用户选择类别</text>
  <text x="665" y="93" text-anchor="middle" fill="#d0d8ff" font-size="9">确认提交</text>

  <!-- ===== 汇聚：对比判定（菱形） ===== -->
  <!-- 从 规则映射 和 用户选择 各引一条线到菱形 -->

  <!-- 规则映射向下 -->
  <line x1="475" y1="104" x2="475" y2="135" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="469,130 475,142 481,130" fill="#5a6a7a"/>

  <!-- 用户选择向下 -->
  <line x1="665" y1="104" x2="665" y2="135" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="659,130 665,142 671,130" fill="#5a6a7a"/>

  <!-- 汇聚横线 -->
  <line x1="475" y1="142" x2="665" y2="142" stroke="#5a6a7a" stroke-width="1.5"/>

  <!-- 汇聚点向下到菱形 -->
  <line x1="570" y1="142" x2="570" y2="160" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="564,155 570,167 576,155" fill="#5a6a7a"/>

  <!-- 菱形：对比判定 -->
  <polygon points="570,170 650,205 570,240 490,205" fill="#e8a840" filter="url(#shadow)" stroke="#d09530" stroke-width="1"/>
  <text x="570" y="202" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">AI推荐</text>
  <text x="570" y="216" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">== 用户选择?</text>

  <!-- ===== 分支 A：左侧 - 一致（投放正确） ===== -->

  <!-- 菱形左出 -->
  <line x1="490" y1="205" x2="350" y2="205" stroke="#3aaa6a" stroke-width="1.5" />
  <!-- 手绘左箭头 -->
  <polygon points="356,200 344,205 356,210" fill="#3aaa6a"/>
  <text x="420" y="198" text-anchor="middle" fill="#3aaa6a" font-size="10" font-weight="bold">是</text>

  <!-- 向下到结果 -->
  <line x1="250" y1="205" x2="250" y2="260" stroke="#3aaa6a" stroke-width="1.5"/>
  <polygon points="244,254 250,266 256,254" fill="#3aaa6a"/>

  <!-- 一致横条 -->
  <rect x="170" y="190" width="160" height="30" rx="15" fill="#3aaa6a" filter="url(#shadow)"/>
  <text x="250" y="210" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">推荐 == 选择</text>

  <!-- 投放正确 -->
  <rect x="170" y="270" width="160" height="46" rx="10" fill="#2d9a5a" filter="url(#shadow)"/>
  <text x="250" y="291" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">投放正确</text>
  <text x="250" y="306" text-anchor="middle" fill="#c0ecd0" font-size="9">记录保存，流程完成</text>

  <!-- ===== 分支 B：右侧 - 不一致（投放错误） ===== -->

  <!-- 菱形右出 -->
  <line x1="650" y1="205" x2="780" y2="205" stroke="#d05a5a" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="710" y="198" text-anchor="middle" fill="#d05a5a" font-size="10" font-weight="bold">否</text>

  <!-- 不一致横条 -->
  <rect x="710" y="190" width="160" height="30" rx="15" fill="#d05a5a" filter="url(#shadow)"/>
  <text x="790" y="210" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">推荐 != 选择</text>

  <!-- 向下到违规记录 -->
  <line x1="790" y1="220" x2="790" y2="260" stroke="#d05a5a" stroke-width="1.5"/>
  <polygon points="784,254 790,266 796,254" fill="#d05a5a"/>

  <!-- 违规记录 -->
  <rect x="700" y="270" width="180" height="46" rx="10" fill="#c84a4a" filter="url(#shadow)"/>
  <text x="790" y="291" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">自动生成违规记录</text>
  <text x="790" y="306" text-anchor="middle" fill="#f0c0c0" font-size="9">分类错误 / 混投</text>

  <!-- 向下到管理员复核 -->
  <line x1="790" y1="316" x2="790" y2="356" stroke="#d05a5a" stroke-width="1.5"/>
  <polygon points="784,350 790,362 796,350" fill="#d05a5a"/>

  <!-- 管理员复核 -->
  <rect x="690" y="366" width="200" height="46" rx="10" fill="#a0508a" filter="url(#shadow)"/>
  <text x="790" y="386" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">管理员复核</text>
  <text x="790" y="401" text-anchor="middle" fill="#e8c0e0" font-size="9">确认违规 / 标记误判</text>

  <!-- 复核 → 左：更新状态 -->
  <line x1="690" y1="389" x2="610" y2="389" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="616,384 604,389 616,394" fill="#5a6a7a"/>

  <rect x="520" y="371" width="80" height="36" rx="8" fill="#d4a030" filter="url(#shadow)"/>
  <text x="560" y="394" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">更新状态</text>

  <!-- 复核 → 下：发起整改 -->
  <line x1="790" y1="412" x2="790" y2="452" stroke="#a0508a" stroke-width="1.5"/>
  <polygon points="784,446 790,458 796,446" fill="#a0508a"/>

  <!-- 整改流程 -->
  <rect x="690" y="462" width="200" height="46" rx="10" fill="#904078" filter="url(#shadow)"/>
  <text x="790" y="482" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">发起整改 → 用户提交</text>
  <text x="790" y="497" text-anchor="middle" fill="#e0c0d8" font-size="9">管理员复核 → 闭环</text>

  <!-- ===== 分支背景标注 ===== -->
  <rect x="150" y="170" width="200" height="160" rx="12" fill="#e8f5ee" fill-opacity="0.4" stroke="#a0d8b0" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="680" y="170" width="210" height="350" rx="12" fill="#fdeaea" fill-opacity="0.4" stroke="#e0a0a0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== 图例 ===== -->
  <rect x="30" y="370" width="160" height="80" rx="8" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="110" y="390" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">图例</text>
  <rect x="45" y="400" width="12" height="12" rx="2" fill="#3aaa6a"/>
  <text x="65" y="411" text-anchor="start" fill="#666" font-size="9">投放正确流程</text>
  <rect x="45" y="420" width="12" height="12" rx="2" fill="#d05a5a"/>
  <text x="65" y="431" text-anchor="start" fill="#666" font-size="9">投放错误 → 整改流程</text>
</svg>
