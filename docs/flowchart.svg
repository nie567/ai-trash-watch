<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <linearGradient id="start" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="violation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rectify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="decision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="430" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">核心业务流程</text>

  <!-- ===== 第 1 行：主流程 ===== -->

  <!-- ① 上传图片 -->
  <rect x="80" y="65" width="120" height="50" rx="25" fill="url(#start)" filter="url(#shadow)"/>
  <text x="140" y="95" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">📤 用户上传图片</text>

  <line x1="200" y1="90" x2="260" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ② AI 检测 -->
  <rect x="270" y="65" width="120" height="50" rx="12" fill="url(#decision)" filter="url(#shadow)"/>
  <text x="330" y="88" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">🔍 AI 检测识别</text>
  <text x="330" y="103" text-anchor="middle" fill="#eef" font-size="10">YOLOv8 推理</text>

  <line x1="390" y1="90" x2="450" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ③ 规则映射 -->
  <rect x="460" y="65" width="130" height="50" rx="12" fill="url(#decision)" filter="url(#shadow)"/>
  <text x="525" y="88" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">📋 规则映射</text>
  <text x="525" y="103" text-anchor="middle" fill="#eef" font-size="10">类别判定</text>

  <line x1="590" y1="90" x2="650" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ④ 用户选择 -->
  <rect x="660" y="65" width="120" height="50" rx="12" fill="url(#start)" filter="url(#shadow)"/>
  <text x="720" y="88" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">👤 用户选择类别</text>
  <text x="720" y="103" text-anchor="middle" fill="#eef" font-size="10">确认提交</text>

  <!-- ===== 出口分支标注 ===== -->
  <line x1="140" y1="115" x2="140" y2="160" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="720" y1="115" x2="720" y2="160" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ===== 两个分支顶部虚线连接 ===== -->
  <line x1="140" y1="155" x2="720" y2="155" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="430" y="147" text-anchor="middle" fill="#999" font-size="11">对比用户选择与 AI 推荐</text>

  <!-- ===== ✅ 分支 A：推荐 == 选择（投放正确） ===== -->
  <rect x="60" y="175" width="160" height="50" rx="25" fill="url(#success)" filter="url(#shadow)"/>
  <text x="140" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">✅ 推荐 == 选择</text>

  <line x1="140" y1="225" x2="140" y2="255" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="265" width="160" height="50" rx="12" fill="url(#success)" filter="url(#shadow)"/>
  <text x="140" y="288" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">🎉 投放正确</text>
  <text x="140" y="303" text-anchor="middle" fill="#eef" font-size="10">记录保存，完成</text>

  <!-- ===== ❌ 分支 B：推荐 != 选择（投放错误） ===== -->
  <rect x="480" y="175" width="170" height="50" rx="25" fill="url(#violation)" filter="url(#shadow)"/>
  <text x="565" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">❌ 推荐 != 选择</text>

  <line x1="565" y1="225" x2="565" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 违规记录 -->
  <rect x="480" y="270" width="170" height="50" rx="12" fill="url(#violation)" filter="url(#shadow)"/>
  <text x="565" y="293" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">⚠️ 自动生成违规记录</text>
  <text x="565" y="308" text-anchor="middle" fill="#eef" font-size="10">分类错误 / 混投</text>

  <line x1="565" y1="320" x2="565" y2="355" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 管理员复核 -->
  <rect x="455" y="365" width="220" height="50" rx="12" fill="url(#rectify)" filter="url(#shadow)"/>
  <text x="565" y="388" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">👮 管理员复核</text>
  <text x="565" y="403" text-anchor="middle" fill="#eef" font-size="10">更新违规状态（确认/误判）</text>

  <!-- 复核 → 更新状态 向右箭头 -->
  <line x1="675" y1="390" x2="740" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="750" y="370" width="90" height="40" rx="12" fill="#ffc107" filter="url(#shadow)"/>
  <text x="795" y="395" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">更新状态</text>

  <!-- 复核 → 发起整改 向下箭头 -->
  <line x1="565" y1="415" x2="565" y2="455" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 整改流程 -->
  <rect x="455" y="465" width="220" height="50" rx="12" fill="url(#rectify)" filter="url(#shadow)"/>
  <text x="565" y="483" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">🔄 发起整改 ➔ 用户提交</text>
  <text x="565" y="501" text-anchor="middle" fill="#eef" font-size="10">管理员复核 ➔ 闭环</text>

  <!-- ===== 分支标注文字 ===== -->
  <text x="140" y="255" text-anchor="middle" fill="#43e97b" font-size="18" font-weight="bold">┃</text>
  <text x="565" y="145" text-anchor="middle" fill="#fa709a" font-size="18" font-weight="bold">┃</text>

</svg>