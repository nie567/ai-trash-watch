<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5a6a7a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d05a5a"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">核心业务流程</text>

  <!-- ===== 第 1 行：主流程 ===== -->

  <!-- ① 上传图片 -->
  <rect x="20" y="52" width="120" height="46" rx="23" fill="#5b7ee5" filter="url(#shadow)"/>
  <text x="80" y="80" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">用户上传图片</text>

  <line x1="140" y1="75" x2="178" y2="75" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ② AI 检测 + 并发控制 -->
  <rect x="188" y="48" width="145" height="54" rx="10" fill="#3a9ad9" filter="url(#shadow)"/>
  <text x="260" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">AI 检测识别</text>
  <text x="260" y="84" text-anchor="middle" fill="#d0e8ff" font-size="9">YOLOv8 推理</text>
  <text x="260" y="96" text-anchor="middle" fill="#ffe0a0" font-size="8">Semaphore(3) 限并发</text>

  <!-- 并发超限分支 -->
  <line x1="260" y1="102" x2="260" y2="120" stroke="#d05a5a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="208" y="121" width="104" height="22" rx="6" fill="#d05a5a" filter="url(#shadow)"/>
  <text x="260" y="136" text-anchor="middle" fill="#fff" font-size="9">超限 → HTTP 429</text>

  <line x1="333" y1="75" x2="371" y2="75" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ③ 规则映射 + 混合判定 -->
  <rect x="381" y="48" width="155" height="54" rx="10" fill="#3a9ad9" filter="url(#shadow)"/>
  <text x="458" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">规则映射 + 混合判定</text>
  <text x="458" y="84" text-anchor="middle" fill="#d0e8ff" font-size="9">className → 类别</text>
  <text x="458" y="96" text-anchor="middle" fill="#ffe0a0" font-size="8">多类别 → "混合待分拣" isMixed=1</text>

  <line x1="536" y1="75" x2="574" y2="75" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ④ 用户选择 -->
  <rect x="584" y="48" width="150" height="46" rx="10" fill="#5b7ee5" filter="url(#shadow)"/>
  <text x="659" y="68" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">用户选择类别</text>
  <text x="659" y="83" text-anchor="middle" fill="#d0d8ff" font-size="9">确认提交</text>

  <!-- 管理员禁止投放（虚线异常分支） -->
  <line x1="659" y1="94" x2="659" y2="114" stroke="#d05a5a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="612" y="115" width="95" height="22" rx="6" fill="#d05a5a" filter="url(#shadow)"/>
  <text x="659" y="130" text-anchor="middle" fill="#fff" font-size="9">Admin → 403</text>

  <!-- ===== 菱形判断：isCorrect ===== -->
  <!-- 主流程：从用户选择框右侧绕行，避免与 Admin→403 虚线重叠 -->
  <line x1="734" y1="71" x2="790" y2="71" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="790" y1="71" x2="790" y2="190" stroke="#5a6a7a" stroke-width="1.5"/>

  <polygon points="790,150 870,190 790,230 710,190" fill="#8068a8" filter="url(#shadow)" stroke="#6a5090" stroke-width="1"/>
  <text x="790" y="186" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">isCorrect?</text>
  <text x="790" y="201" text-anchor="middle" fill="#d8c8ee" font-size="8">推荐 == 用户选择 ?</text>

  <!-- ===== isCorrect=0：向左走到违规流程 ===== -->
  <line x1="710" y1="190" x2="438" y2="190" stroke="#d05a5a" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="575" y="183" text-anchor="middle" fill="#d05a5a" font-size="10" font-weight="bold">= 0</text>

  <!-- 违规触发条件 -->
  <rect x="228" y="165" width="210" height="56" rx="8" fill="#c84a4a" filter="url(#shadow)"/>
  <text x="333" y="183" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">自动生成违规记录</text>
  <text x="333" y="197" text-anchor="middle" fill="#ffd0d0" font-size="8">① 错误+非混投 → 分类错误</text>
  <text x="333" y="209" text-anchor="middle" fill="#ffd0d0" font-size="8">② 错误+混投 / 混投未选混合 → 混投</text>

  <!-- 违规级别（三击规则） -->
  <line x1="333" y1="221" x2="333" y2="252" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="327,246 333,258 339,246" fill="#5a6a7a"/>

  <rect x="185" y="260" width="296" height="52" rx="8" fill="#a08030" filter="url(#shadow)"/>
  <text x="333" y="278" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">违规级别（三击规则）</text>
  <text x="333" y="292" text-anchor="middle" fill="#ffe8b0" font-size="9">混投 → MEDIUM（固定）</text>
  <text x="333" y="306" text-anchor="middle" fill="#ffe8b0" font-size="9">分类错误 → 首次 LOW / 累计 ≥3 次 HIGH</text>

  <!-- ===== isCorrect=1：向下走到保存记录 ===== -->
  <line x1="790" y1="230" x2="790" y2="330" stroke="#3aaa6a" stroke-width="1.5"/>
  <polygon points="784,324 790,336 796,324" fill="#3aaa6a"/>
  <text x="808" y="280" text-anchor="start" fill="#3aaa6a" font-size="10" font-weight="bold">= 1</text>

  <!-- 违规流程汇入保存记录 -->
  <line x1="333" y1="312" x2="333" y2="332" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="333" y1="332" x2="673" y2="332" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="500" y="326" text-anchor="middle" fill="#5a6a7a" font-size="8">违规+记录一起保存</text>

  <!-- 保存投放记录 -->
  <rect x="675" y="312" width="230" height="46" rx="10" fill="#5070a0" filter="url(#shadow)"/>
  <text x="790" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">保存投放记录（事务保护）</text>
  <text x="790" y="348" text-anchor="middle" fill="#c0d0e8" font-size="9">所有记录 status = PENDING</text>

  <!-- ===== 管理员人工复核（全量必经） ===== -->
  <line x1="790" y1="358" x2="790" y2="388" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="784,382 790,394 796,382" fill="#5a6a7a"/>

  <rect x="620" y="396" width="340" height="65" rx="12" fill="#a0508a" filter="url(#shadow)"/>
  <text x="790" y="420" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">管理员人工复核（全量必经）</text>
  <text x="790" y="436" text-anchor="middle" fill="#e8c0e0" font-size="10">指定 finalCategory → 重新判定 isCorrect</text>
  <text x="790" y="451" text-anchor="middle" fill="#e8c0e0" font-size="9">status: PENDING → REVIEWED（事务保护）</text>

  <!-- ===== 复核结果分支 ===== -->
  <line x1="790" y1="461" x2="790" y2="488" stroke="#5a6a7a" stroke-width="1.5"/>

  <!-- 菱形 -->
  <polygon points="790,493 875,528 790,563 705,528" fill="#e8a840" filter="url(#shadow)" stroke="#d09530" stroke-width="1"/>
  <text x="790" y="524" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">复核结果</text>
  <text x="790" y="538" text-anchor="middle" fill="#fff" font-size="9">isCorrect?</text>

  <!-- === 左分支：确认正确 === -->
  <line x1="705" y1="528" x2="430" y2="528" stroke="#3aaa6a" stroke-width="1.5"/>
  <polygon points="436,523 424,528 436,533" fill="#3aaa6a"/>
  <text x="565" y="521" text-anchor="middle" fill="#3aaa6a" font-size="10" font-weight="bold">isCorrect = 1</text>

  <rect x="270" y="510" width="152" height="36" rx="8" fill="#2d9a5a" filter="url(#shadow)"/>
  <text x="346" y="532" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">确认投放正确</text>

  <line x1="346" y1="546" x2="346" y2="575" stroke="#3aaa6a" stroke-width="1.2"/>
  <polygon points="340,569 346,581 352,569" fill="#3aaa6a"/>

  <rect x="248" y="583" width="196" height="32" rx="8" fill="#40a870" filter="url(#shadow)"/>
  <text x="346" y="603" text-anchor="middle" fill="#fff" font-size="10">关联违规 → IGNORED (误判)</text>

  <line x1="346" y1="615" x2="346" y2="643" stroke="#3aaa6a" stroke-width="1.2"/>
  <polygon points="340,637 346,649 352,637" fill="#3aaa6a"/>

  <rect x="278" y="651" width="136" height="30" rx="15" fill="#2d9a5a" filter="url(#shadow)"/>
  <text x="346" y="671" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">✓ 流程完成</text>

  <!-- === 右分支：确认错误 === -->
  <line x1="875" y1="528" x2="913" y2="528" stroke="#d05a5a" stroke-width="1.5"/>
  <text x="945" y="521" text-anchor="middle" fill="#d05a5a" font-size="10" font-weight="bold">isCorrect = 0</text>

  <rect x="838" y="548" width="150" height="30" rx="8" fill="#c84a4a" filter="url(#shadow)"/>
  <text x="913" y="567" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">已有违规 → 保持</text>

  <rect x="838" y="585" width="150" height="30" rx="8" fill="#b84040" filter="url(#shadow)"/>
  <text x="913" y="604" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">无违规 → 补建</text>
  <text x="913" y="624" text-anchor="middle" fill="#a08080" font-size="8">(原 isCorrect=1 被改判)</text>

  <!-- 菱形右顶点沿 x=913 下行，分支进入两个框顶部 -->
  <line x1="913" y1="528" x2="913" y2="548" stroke="#d05a5a" stroke-width="1.2"/>

  <!-- 两个框右边缘出线，沿 x=988 外侧下行汇聚到整改 -->
  <line x1="988" y1="563" x2="1005" y2="563" stroke="#d05a5a" stroke-width="1.2"/>
  <line x1="988" y1="600" x2="1005" y2="600" stroke="#d05a5a" stroke-width="1.2"/>
  <line x1="1005" y1="563" x2="1005" y2="695" stroke="#d05a5a" stroke-width="1.2"/>
  <line x1="1005" y1="695" x2="1008" y2="695" stroke="#d05a5a" stroke-width="1.2"/>
  <polygon points="1002,689 1014,695 1002,701" fill="#d05a5a"/>

  <!-- 发起整改 -->
  <rect x="818" y="678" width="190" height="34" rx="8" fill="#904078" filter="url(#shadow)"/>
  <text x="913" y="700" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">发起整改任务（去重）</text>

  <!-- 整改闭环 -->
  <line x1="818" y1="695" x2="760" y2="695" stroke="#904078" stroke-width="1.2"/>

  <rect x="540" y="678" width="216" height="52" rx="8" fill="#7050a0" filter="url(#shadow)"/>
  <text x="648" y="697" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">整改闭环（事务保护）</text>
  <text x="648" y="711" text-anchor="middle" fill="#d0c0e0" font-size="8">PENDING → SUBMITTED → APPROVED / REJECTED</text>
  <text x="648" y="724" text-anchor="middle" fill="#c8b0e0" font-size="8">APPROVED → 违规→RECTIFIED | REJECTED → 违规不变</text>

  <!-- 操作日志 -->
  <rect x="20" y="762" width="210" height="36" rx="8" fill="#607888" filter="url(#shadow)"/>
  <text x="125" y="785" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">OperationLog 全程记录</text>

  <!-- ===== 底部注释 ===== -->
  <rect x="20" y="715" width="210" height="42" rx="8" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="125" y="732" text-anchor="middle" fill="#555" font-size="9">⚠ 管理员复核是全量必经环节</text>
  <text x="125" y="747" text-anchor="middle" fill="#555" font-size="9">包括 isCorrect=1 的"正确"记录</text>

  <!-- ===== 图例 ===== -->
  <rect x="20" y="396" width="210" height="200" rx="8" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="125" y="416" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">图例</text>
  <rect x="35" y="426" width="12" height="10" rx="2" fill="#3aaa6a"/>
  <text x="55" y="435" fill="#666" font-size="9">投放正确 → 流程完成</text>
  <rect x="35" y="442" width="12" height="10" rx="2" fill="#d05a5a"/>
  <text x="55" y="451" fill="#666" font-size="9">投放错误 → 违规 + 整改</text>
  <rect x="35" y="458" width="12" height="10" rx="2" fill="#a0508a"/>
  <text x="55" y="467" fill="#666" font-size="9">管理员人工复核（必经）</text>
  <rect x="35" y="474" width="12" height="10" rx="2" fill="#8068a8"/>
  <text x="55" y="483" fill="#666" font-size="9">判断节点 isCorrect</text>
  <rect x="35" y="490" width="12" height="10" rx="2" fill="#a08030"/>
  <text x="55" y="499" fill="#666" font-size="9">违规三击规则</text>
  <rect x="35" y="506" width="12" height="10" rx="2" fill="#c84a4a"/>
  <text x="55" y="515" fill="#666" font-size="9">自动生成违规记录</text>
  <rect x="35" y="522" width="12" height="10" rx="2" fill="#e8a840"/>
  <text x="55" y="531" fill="#666" font-size="9">复核结果判断</text>
  <rect x="35" y="538" width="12" height="10" rx="2" fill="#8a8a9a"/>
  <text x="55" y="547" fill="#666" font-size="9">管理员禁止投放 / 超限</text>
  <rect x="35" y="554" width="12" height="10" rx="2" fill="#3a9ad9"/>
  <text x="55" y="563" fill="#666" font-size="9">并发控制 / 规则映射</text>
  <rect x="35" y="570" width="12" height="10" rx="2" fill="#5070a0"/>
  <text x="55" y="579" fill="#666" font-size="9">事务保护操作</text>
</svg>