<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowReq" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5a6a7a"/>
    </marker>
    <marker id="arrowRes" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#90a0b0"/>
    </marker>
  </defs>

  <!-- ========== 主标题 ========== -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">AI-TrashWatch 系统架构图</text>

  <!-- ========== 三大分区背景 ========== -->
  <rect x="15" y="45" width="175" height="515" rx="16" fill="#f0f0fa" stroke="#d0d0e8" stroke-width="1"/>
  <text x="102" y="68" text-anchor="middle" fill="#8888aa" font-size="11" font-weight="bold">表现层</text>

  <rect x="205" y="45" width="340" height="515" rx="16" fill="#eef6fb" stroke="#c8dce8" stroke-width="1"/>
  <text x="375" y="68" text-anchor="middle" fill="#7099b8" font-size="11" font-weight="bold">业务逻辑层（Tomcat :8081）</text>

  <rect x="560" y="45" width="280" height="515" rx="16" fill="#fdf2f0" stroke="#e8d0cc" stroke-width="1"/>
  <text x="700" y="68" text-anchor="middle" fill="#c07060" font-size="11" font-weight="bold">AI 推理层（:8080）</text>

  <!-- ========== 表现层：浏览器 ========== -->
  <rect x="35" y="120" width="135" height="90" rx="10" fill="#7c8cf5" filter="url(#shadow)"/>
  <text x="102" y="148" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">浏览器</text>
  <text x="102" y="166" text-anchor="middle" fill="#dde" font-size="10">JSP / JavaScript</text>
  <text x="102" y="181" text-anchor="middle" fill="#dde" font-size="10">ECharts / CSRF Token</text>
  <text x="102" y="196" text-anchor="middle" fill="#dde" font-size="10">Ajax 异步交互</text>

  <!-- ========== 业务逻辑层：Tomcat 容器 ========== -->
  <rect x="225" y="80" width="300" height="470" rx="12" fill="none" stroke="#a0bcd0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="375" y="100" text-anchor="middle" fill="#6090b0" font-size="12" font-weight="bold">Apache Tomcat 10</text>

  <!-- Filter 安全层 -->
  <rect x="245" y="115" width="260" height="62" rx="8" fill="#8faabe" filter="url(#shadow)"/>
  <text x="375" y="135" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Filter 安全层（按顺序执行）</text>
  <text x="375" y="152" text-anchor="middle" fill="#dde8ee" font-size="9">XssFilter → CsrfFilter → CharEncoding</text>
  <text x="375" y="167" text-anchor="middle" fill="#dde8ee" font-size="9">→ AuthFilter → AdminFilter</text>

  <!-- 箭头：Filter → Servlet -->
  <line x1="375" y1="177" x2="375" y2="195" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="369,190 375,202 381,190" fill="#5a6a7a"/>

  <!-- Servlet 控制层 -->
  <rect x="245" y="205" width="260" height="42" rx="8" fill="#4a90d9" filter="url(#shadow)"/>
  <text x="375" y="231" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Servlet 控制层（20 个）</text>

  <!-- 箭头：Servlet → Service -->
  <line x1="375" y1="247" x2="375" y2="265" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="369,260 375,272 381,260" fill="#5a6a7a"/>

  <!-- Service 业务层 -->
  <rect x="245" y="275" width="260" height="48" rx="8" fill="#3a7bc8" filter="url(#shadow)"/>
  <text x="375" y="295" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Service 业务层（10 个）</text>
  <text x="375" y="311" text-anchor="middle" fill="#c8ddf0" font-size="9">推理·记录·违规·整改·规则·知识·统计·日志·用户</text>

  <!-- 箭头：Service → DAO -->
  <line x1="375" y1="323" x2="375" y2="341" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="369,336 375,348 381,336" fill="#5a6a7a"/>

  <!-- DAO 数据访问 -->
  <rect x="245" y="350" width="260" height="42" rx="8" fill="#2a66b0" filter="url(#shadow)"/>
  <text x="375" y="376" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DAO 数据访问（9 个）</text>

  <!-- 箭头：DAO → MySQL -->
  <line x1="375" y1="392" x2="375" y2="410" stroke="#5a6a7a" stroke-width="1.5"/>
  <polygon points="369,405 375,417 381,405" fill="#5a6a7a"/>
  <text x="390" y="406" text-anchor="start" fill="#8899aa" font-size="9">JDBC / PreparedStatement</text>

  <!-- MySQL -->
  <rect x="285" y="425" width="180" height="42" rx="21" fill="#34495e" filter="url(#shadow)"/>
  <text x="375" y="451" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">MySQL 8.0</text>

  <!-- AppContext 依赖注入容器 -->
  <rect x="245" y="478" width="260" height="32" rx="8" fill="#608078" filter="url(#shadow)"/>
  <text x="375" y="499" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">AppContext 容器（AppContextListener 启动时初始化）</text>

  <!-- OperationLog -->
  <rect x="245" y="518" width="260" height="28" rx="8" fill="#607888" filter="url(#shadow)"/>
  <text x="375" y="537" text-anchor="middle" fill="#fff" font-size="10">OperationLogService 操作日志</text>

  <!-- ========== AI 推理层 ========== -->
  <rect x="585" y="95" width="230" height="180" rx="12" fill="none" stroke="#d4a09a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="700" y="115" text-anchor="middle" fill="#c07060" font-size="12" font-weight="bold">DJL 推理微服务</text>
  <text x="700" y="130" text-anchor="middle" fill="#b0a0a0" font-size="10">Spring Boot :8080</text>

  <rect x="605" y="145" width="190" height="42" rx="8" fill="#d97a5a" filter="url(#shadow)"/>
  <text x="700" y="171" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">YOLOv8 自定义模型</text>

  <rect x="605" y="200" width="190" height="36" rx="8" fill="#c0886a" filter="url(#shadow)"/>
  <text x="700" y="223" text-anchor="middle" fill="#fff" font-size="11">ONNX Runtime 推理</text>

  <rect x="605" y="248" width="190" height="22" rx="6" fill="#b0a090" filter="url(#shadow)"/>
  <text x="700" y="264" text-anchor="middle" fill="#fff" font-size="9">输入目录 → 输出标注图</text>

  <!-- 并发控制说明 -->
  <rect x="595" y="300" width="220" height="38" rx="8" fill="#f8f0e0" stroke="#d0b880" stroke-width="1"/>
  <text x="705" y="318" text-anchor="middle" fill="#806030" font-size="9">推理并发控制：Semaphore(3)</text>
  <text x="705" y="332" text-anchor="middle" fill="#806030" font-size="9">超限 → HTTP 429 推理服务繁忙</text>

  <!-- ========== 连线：浏览器 → Filter ========== -->
  <line x1="170" y1="150" x2="245" y2="140" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowReq)"/>
  <text x="207" y="137" text-anchor="middle" fill="#8899aa" font-size="9">HTTP 请求</text>
  <line x1="245" y1="155" x2="170" y2="165" stroke="#90a0b0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRes)"/>
  <text x="207" y="175" text-anchor="middle" fill="#8899aa" font-size="9">JSP/JSON 响应</text>

  <!-- ========== 连线：Service → DJL ========== -->
  <line x1="505" y1="290" x2="605" y2="165" stroke="#d08050" stroke-width="1.5" marker-end="url(#arrowReq)"/>
  <text x="555" y="212" text-anchor="middle" fill="#c08060" font-size="9">图片文件名</text>
  <line x1="605" y1="190" x2="505" y2="300" stroke="#d0a080" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRes)"/>
  <text x="555" y="260" text-anchor="middle" fill="#c08060" font-size="9">检测结果 JSON</text>

  <!-- ========== 右侧辅助说明 ========== -->
  <rect x="595" y="360" width="220" height="160" rx="10" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="705" y="380" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">核心业务模块</text>
  <text x="610" y="400" fill="#666" font-size="9">● 推理+规则映射 → 推荐类别</text>
  <text x="610" y="417" fill="#666" font-size="9">● 多类别映射 → 混合待分拣</text>
  <text x="610" y="434" fill="#666" font-size="9">● 用户确认 → 自动判 isCorrect</text>
  <text x="610" y="451" fill="#666" font-size="9">● 管理员复核（全量）→ 忽略/确认</text>
  <text x="610" y="468" fill="#666" font-size="9">● 整改闭环 → PENDING→SUBMITTED</text>
  <text x="610" y="485" fill="#666" font-size="9">　　　　　 → APPROVED/REJECTED</text>
  <text x="610" y="502" fill="#666" font-size="9">● 操作日志全程记录</text>

  <!-- ========== 图例 ========== -->
  <rect x="25" y="440" width="155" height="95" rx="8" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="102" y="458" text-anchor="middle" fill="#666" font-size="10" font-weight="bold">图例</text>
  <line x1="40" y1="472" x2="70" y2="472" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrowReq)"/>
  <text x="80" y="476" fill="#888" font-size="9">请求 / 调用</text>
  <line x1="40" y1="488" x2="65" y2="488" stroke="#90a0b0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRes)"/>
  <text x="80" y="492" fill="#888" font-size="9">响应 / 返回</text>
  <rect x="40" y="500" width="12" height="8" rx="2" fill="#8faabe"/>
  <text x="80" y="509" fill="#888" font-size="9">Filter 安全层</text>
  <rect x="40" y="516" width="12" height="8" rx="2" fill="#608078"/>
  <text x="80" y="525" fill="#888" font-size="9">AppContext 容器</text>
</svg>